name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Каждая проверка — отдельная задача: так по списку задач сразу видно, что
# именно сломалось, без чтения полного лога.
jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in nxrev.sh setup.sh lib/*.sh lang/*.sh tests/*.sh; do
            echo "-- $f"; bash -n "$f"
          done

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      # SC1091 — shellcheck не ходит по source; SC2154 и SC2034 неизбежны там,
      # где переменная объявлена в одном файле, а нужна в другом.
      - run: |
          shellcheck --shell=bash --severity=warning \
                     --exclude=SC1091,SC2154,SC2034 \
                     nxrev.sh setup.sh lib/*.sh lang/*.sh tests/*.sh

  lang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/check_lang.sh

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/unit.sh

  decoy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/decoy.sh
